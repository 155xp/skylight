[package]
name = "skylight"
version = "0.1.0"
edition = "2024"
description = "Low-latency browser remote desktop for Linux: KWin/X11 capture, NVENC, WebCodecs"
license = "MIT"
repository = "https://github.com/155xp/skylight"

[dependencies]
anyhow = "1.0.104"
axum = { version = "0.8.9", features = ["ws"] }
base64 = "0.23.1"
clap = { version = "4.6.7", features = ["derive", "env"] }
ed25519-dalek = "3.0.0"
ffmpeg-sys-next = { version = "7", default-features = false, features = ["avcodec", "swscale"] }
futures-util = "0.3.34"
getrandom = "0.4.3"
libc = "0.2.191"
pipewire = "0.10.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
wayland-backend = "0.3.17"
wayland-client = "0.31.15"
wayland-protocols = { version = "0.32.13", features = ["client", "unstable"] }
wayland-protocols-wlr = { version = "0.3.12", features = ["client"] }
wayland-scanner = "0.31.11"
x11rb = { version = "0.14.0", features = ["shm", "damage", "xfixes", "xtest", "randr"] }

[profile.release]
strip = true
